document:
  title: Implementation Plan
  intro: 'Traceability plan for the **ft_irc** IRC server project, derived from:'
features:
- id: FEAT-001
  name: BaseException and Business exceptions (one per IRC error code)
  related_elements: []
  depends_on: []
  acceptance_criteria:
  - id: AC-001
    description: BaseException exposes the IRC numeric/error code, a stable message, and any context required
      to build an IRC error reply.
  - id: AC-002
    description: Every concrete business exception derives from BaseException and maps to exactly one
      documented IRC error condition.
  - id: AC-003
    description: Business exceptions preserve actionable context (such as nickname, channel, command,
      or parameter) without depending on transport-layer state.
  tasks:
  - id: T-001
    description: Tests BaseException
  - id: T-002
    description: Implement BaseException
  - id: T-003
    description: Refactor BaseException
- id: FEAT-002
  name: Client entity and ClientRegistry
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-001
  acceptance_criteria:
  - id: AC-004
    description: Client stores and exposes its connection identity, registration/authentication state,
      nickname, username, real name, and connection metadata without inconsistent duplicate state.
  - id: AC-005
    description: Client input and output buffers preserve byte order, support partial reads/writes, and
      retain unsent or unprocessed bytes between event-loop iterations.
  - id: AC-006
    description: ClientRegistry indexes each live client by file descriptor and supports lookup by fd
      without returning stale or disconnected clients.
  - id: AC-007
    description: Registering, retrieving, and removing clients keeps the registry consistent and prevents
      duplicate fd ownership.
  - id: AC-008
    description: Operations on unknown, already-registered, or already-removed clients raise the corresponding
      typed business exception.
  - id: AC-201
    description: ClientBuffer appends pushed data at the end and preserves byte order across any number
      of consecutive pushes.
  - id: AC-202
    description: peek(length) returns at most the first length bytes without modifying the buffer, and
      consume(length) removes exactly those bytes from the front without ever removing more than is stored.
  - id: AC-203
    description: find(needle) returns the position of the first occurrence of the needle or std::string::npos
      when absent, and empty(), size() and clear() always reflect the current content.
  - id: AC-204
    description: Data that arrives fragmented across several pushes is retained so that a delimiter split
      between two pushes can still be found afterwards.
  tasks:
  - id: T-004
    description: Tests Client and ClientBuffer
  - id: T-005
    description: Implement Client and ClientBuffer
  - id: T-006
    description: Refactor Client and ClientBuffer
  - id: T-007
    description: Tests ClientRegistry
  - id: T-008
    description: Implement ClientRegistry
  - id: T-009
    description: Refactor ClientRegistry
- id: FEAT-003
  name: Client authentication management
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-002
  acceptance_criteria:
  - id: AC-009
    description: AuthenticationManager validates the configured server password using the supplied PASS
      value and does not authenticate a client when the password is absent or incorrect.
  - id: AC-010
    description: Authentication state is tracked independently for each client and changes to authenticated
      only after successful validation.
  - id: AC-011
    description: Repeated PASS attempts do not corrupt authentication state, and successful authentication
      is not revoked by an unrelated client's attempt.
  - id: AC-012
    description: Missing, malformed, or incorrect credentials raise the appropriate business exception
      so the command layer can return the corresponding IRC error.
  tasks:
  - id: T-010
    description: Tests AuthenticationManager
  - id: T-011
    description: Implement AuthenticationManager
  - id: T-012
    description: Refactor AuthenticationManager
- id: FEAT-004
  name: Client registration management
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-002
  acceptance_criteria:
  - id: AC-013
    description: NickManager validates nickname syntax and length according to the server's supported
      IRC nickname rules.
  - id: AC-014
    description: NickManager reserves nicknames case-insensitively and prevents two connected clients
      from owning equivalent nicknames.
  - id: AC-015
    description: Nickname changes release the previous nickname and reserve the new nickname atomically,
      without leaving stale reservations.
  - id: AC-016
    description: RegistrationManager stores the USER registration fields and determines whether the required
      registration fields have been supplied.
  - id: AC-017
    description: Registration completion is derived consistently from the required authentication, nickname,
      and USER state; partial registration remains pending.
  - id: AC-018
    description: Invalid, missing, or already-in-use nicknames and invalid registration transitions raise
      the appropriate business exceptions.
  tasks:
  - id: T-013
    description: Tests NickManager
  - id: T-014
    description: Implement NickManager
  - id: T-015
    description: Refactor NickManager
  - id: T-016
    description: Tests RegistrationManager
  - id: T-017
    description: Implement RegistrationManager
  - id: T-018
    description: Refactor RegistrationManager
- id: FEAT-039
  name: Client pending I/O management (PendingIOManager)
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-002
  acceptance_criteria:
  - id: AC-207
    description: pushInput and pushOutput append data to the target client's input or output buffer and
      mark that fd as having pending input or pending output.
  - id: AC-208
    description: getNextInputLine extracts exactly one complete line, removes it from the input buffer,
      and returns false when no complete line is available, leaving partial data untouched.
  - id: AC-209
    description: An fd is reported as having pending input when no complete line remains but buffer is not empty, and
      stops being reported as having pending output once its output buffer is empty.
  - id: AC-210
    description: peekOutput does not modify the output buffer, and consumeOutput removes exactly the bytes
      reported as sent, keeping the remaining bytes in order for the next write.
  - id: AC-211
    description: getHasPendingInput and getHasPendingOutput return consistent snapshots of the fds that
      currently have data to process or to send.
  - id: AC-212
    description: Operations on an unknown fd raise the corresponding typed business exception and do not
      create any pending state.
  tasks:
  - id: T-179
    description: Tests PendingIOManager
  - id: T-180
    description: Implement PendingIOManager
  - id: T-181
    description: Refactor PendingIOManager
- id: FEAT-005
  name: Channel entity and ChannelRegistry
  related_elements:
  - channel_subsystem.mmd
  depends_on:
  - FEAT-001
  acceptance_criteria:
  - id: AC-019
    description: Channel stores its name, topic, modes, key/limit configuration, and membership/operator
      state required by supported IRC commands.
  - id: AC-020
    description: Channel membership supports adding and removing clients while maintaining a single consistent
      membership relationship.
  - id: AC-021
    description: Channel membership distinguishes ordinary members from channel operators and exposes
      membership/operator checks.
  - id: AC-022
    description: ChannelRegistry identifies channels by their IRC case-insensitive channel name and supports
      lookup by name.
  - id: AC-023
    description: ChannelRegistry creates a channel when required, reuses an existing channel, and removes
      it when its final member leaves, according to server lifecycle rules.
  - id: AC-024
    description: Duplicate creation, invalid channel names, missing channels, and inconsistent membership
      operations raise the corresponding business exceptions.
  tasks:
  - id: T-019
    description: Tests Channel
  - id: T-020
    description: Implement Channel
  - id: T-021
    description: Refactor Channel
  - id: T-022
    description: Tests ChannelRegistry
  - id: T-023
    description: Implement ChannelRegistry
  - id: T-024
    description: Refactor ChannelRegistry
- id: FEAT-041
  name: Channel membership and settings management (ChannelMembershipManager, ChannelSettingsManager)
  related_elements:
  - channel_subsystem.mmd
  depends_on:
  - FEAT-002
  - FEAT-005
  acceptance_criteria:
  - id: AC-218
    description: createChannel registers a new channel in the ChannelRegistry and adds the creating client
      as its first member and operator.
  - id: AC-219
    description: addMemberToChannel and removeClientFromChannel update both the channel's member set and
      the client's joined channel set, keeping them consistent.
  - id: AC-220
    description: removeClientFromChannel also removes the client's operator and invite status for that
      channel, and removes the channel from the registry when its last member leaves.
  - id: AC-221
    description: removeClientFromAllChannels removes the client from every channel it has joined and leaves
      no stale membership, operator or invite state behind.
  - id: AC-222
    description: isMember, isOperator and isInvited report the current state accurately, and return false
      for clients with no relation to the channel.
  - id: AC-223
    description: setOperator grants or revokes operator status only for clients that are members of the
      channel.
  - id: AC-224
    description: addInviteToChannel records an invitation and consumeInviteToChannel removes it, so an
      invitation can be used only once.
  - id: AC-225
    description: ChannelSettingsManager updates invite-only, topic-protected, limit, key and topic on
      an existing channel and does not alter members, operators or invitations.
  - id: AC-226
    description: Operations on an unknown channel, an unknown client, or a client that is already a member
      or not a member raise the corresponding typed business exception.
  tasks:
  - id: T-185
    description: Tests ChannelMembershipManager
  - id: T-186
    description: Implement ChannelMembershipManager
  - id: T-187
    description: Refactor ChannelMembershipManager
  - id: T-188
    description: Tests ChannelSettingsManager
  - id: T-189
    description: Implement ChannelSettingsManager
  - id: T-190
    description: Refactor ChannelSettingsManager
- id: FEAT-042
  name: Channel broadcast management (ChannelBroadcastManager)
  related_elements:
  - channel_subsystem.mmd
  - client_subsystem.mmd
  depends_on:
  - FEAT-005
  - FEAT-039
  acceptance_criteria:
  - id: AC-227
    description: broadcast queues the given message in the output of every current member of the channel
      through PendingIOManager.
  - id: AC-228
    description: The client identified by the fd argument (the sender) does not receive its own message.
  - id: AC-229
    description: Broadcasting to a channel with no other members is a no-op and does not raise an error.
  - id: AC-230
    description: Broadcasting to an unknown channel raises the corresponding typed business exception
      and does not queue any output.
  - id: AC-231
    description: broadcast does not modify channel membership or settings.
  tasks:
  - id: T-191
    description: Tests ChannelBroadcastManager
  - id: T-192
    description: Implement ChannelBroadcastManager
  - id: T-193
    description: Refactor ChannelBroadcastManager
- id: FEAT-006
  name: Channel management (ChannelSystem)
  related_elements:
  - channel_subsystem.mmd
  depends_on:
  - FEAT-005
  - FEAT-041
  - FEAT-042
  acceptance_criteria:
  - id: AC-025
    description: ChannelSystem validates channel names and coordinates channel creation, joining, leaving,
      and membership updates through ChannelRegistry.
  - id: AC-026
    description: A client can join an existing channel or cause a valid channel to be created, and receives
      the channel's current membership/topic state as required by the protocol.
  - id: AC-027
    description: A client leaving a channel is removed from membership, and an empty channel is destroyed
      when the server's lifecycle rules require it.
  - id: AC-028
    description: Channel messages are delivered exactly once to all current channel members except the
      sender, without being sent to non-members.
  - id: AC-029
    description: Supported channel modes are parsed, validated, stored, and enforced consistently by channel
      operations.
  - id: AC-030
    description: Invalid channel names, attempts to join inaccessible channels, duplicate membership,
      or attempts to leave a channel the client has not joined raise appropriate business exceptions.
  - id: AC-232
    description: ChannelDetails exposes a snapshot of a channel's name, topic, key, limit, invite-only
      flag, topic-protected flag, member fds and operator fds.
  - id: AC-233
    description: ChannelDetails is a plain value type that can be copied and remains valid after the channel
      it was built from is modified or removed.
  tasks:
  - id: T-025
    description: Tests ChannelSystem
  - id: T-026
    description: Implement ChannelSystem and ChannelDetails struct
  - id: T-027
    description: Refactor ChannelSystem
- id: FEAT-040
  name: Client lifecycle management (ClientLifecycleManager)
  related_elements:
  - client_subsystem.mmd
  - channel_subsystem.mmd
  depends_on:
  - FEAT-002
  - FEAT-003
  - FEAT-004
  - FEAT-039
  - FEAT-041
  acceptance_criteria:
  - id: AC-213
    description: addClient registers a new client for the given fd in an unauthenticated, unregistered
      and non-quitting state, and a duplicate fd raises the corresponding typed business exception.
  - id: AC-214
    description: removeClient releases everything owned by the client, including channel memberships,
      reserved nickname, authentication and registration state, and pending I/O state, before removing
      it from the registry.
  - id: AC-215
    description: After removeClient no subsystem keeps a stale reference to the removed fd or its nickname,
      and the nickname becomes available again.
  - id: AC-216
    description: Removing an unknown fd raises the corresponding typed business exception and does not
      affect any other client.
  - id: AC-217
    description: getIsQuitting returns the fds of clients marked as quitting, and getClientsToClose returns
      only those quitting clients whose pending output has already been fully sent.
  tasks:
  - id: T-182
    description: Tests ClientLifecycleManager
  - id: T-183
    description: Implement ClientLifecycleManager
  - id: T-184
    description: Refactor ClientLifecycleManager
- id: FEAT-007
  name: Client management (ClientSystem)
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-002
  - FEAT-003
  - FEAT-004
  - FEAT-039
  - FEAT-040
  acceptance_criteria:
  - id: AC-031
    description: ClientSystem tracks connected, pending-registration, and quitting clients without placing
      a client in conflicting lifecycle states.
  - id: AC-032
    description: ClientSystem provides consistent access to client records by the supported identifiers
      and delegates ownership/index consistency to ClientRegistry.
  - id: AC-033
    description: Disconnecting a client removes it from active management and initiates cleanup of nickname
      and channel memberships.
  - id: AC-034
    description: Repeated disconnect or lifecycle transitions are handled idempotently or rejected with
      a documented business exception, without corrupting state.
  - id: AC-035
    description: Requests involving unknown clients or invalid client lifecycle transitions raise the
      appropriate business exception.
  - id: AC-205
    description: ClientDetails exposes a snapshot of a client's fd, nick, username, realname, hostname,
      authenticated, registered and quitting flags, and joined channel names.
  - id: AC-206
    description: ClientDetails is a plain value type that can be copied and remains valid after the client
      it was built from is removed or modified.
  tasks:
  - id: T-028
    description: Tests ClientSystem
  - id: T-029
    description: Implement ClientSystem and ClientDetails struct
  - id: T-030
    description: Refactor ClientSystem
- id: FEAT-008
  name: IRCDto
  related_elements: []
  depends_on: []
  acceptance_criteria:
  - id: AC-036
    description: IRCDto represents a parsed IRC message with command, ordered middle parameters, and an
      optional trailing parameter while preserving parameter contents.
  - id: AC-037
    description: IRCDto distinguishes absent parameters from empty values and supports the maximum parameter
      count defined by the parser contract.
  tasks:
  - id: T-031
    description: Implement IRCDto struct
- id: FEAT-009
  name: ISecurityFilter and SecurityFilterFactory
  related_elements:
  - security_filtering.mmd
  depends_on:
  - FEAT-001
  - FEAT-007
  - FEAT-006
  acceptance_criteria:
  - id: AC-038
    description: ISecurityFilter defines a consistent contract for evaluating whether a client may execute
      a command in the current server state.
  - id: AC-039
    description: SecurityFilterFactory constructs individual filters and composes multiple filters into
      a deterministic chain.
  - id: AC-040
    description: Filter-chain evaluation stops at the first rejection and allows the command only when
      every configured filter accepts it.
  - id: AC-041
    description: Invalid filter configuration or an attempted filter evaluation with an invalid client/context
      raises the appropriate business exception.
  tasks:
  - id: T-032
    description: Implement ISecurityFilter
  - id: T-033
    description: Tests SecurityFilterFactory(throws)
  - id: T-034
    description: Implement SecurityFilterFactory
  - id: T-035
    description: Refactor SecurityFilterFactory
- id: FEAT-010
  name: ICommand and CommandFactory
  related_elements:
  - command_subsystem.mmd
  depends_on:
  - FEAT-001
  - FEAT-007
  - FEAT-006
  - FEAT-009
  acceptance_criteria:
  - id: AC-042
    description: ICommand defines a consistent execution contract receiving the parsed IRC message and
      the client/server context required by command handlers.
  - id: AC-043
    description: CommandFactory resolves supported command names case-insensitively and creates the corresponding
      command implementation.
  - id: AC-044
    description: Unknown or unsupported command names are represented by the appropriate business exception
      or protocol-level unknown-command result, never by a null command or undefined behavior.
  - id: AC-045
    description: Invalid command construction arguments or inconsistent factory registration raise an
      appropriate business exception.
  tasks:
  - id: T-036
    description: Implement ICommand
  - id: T-037
    description: Tests CommandFactory(throws)
  - id: T-038
    description: Implement CommandFactory
  - id: T-039
    description: Refactor CommandFactory
- id: FEAT-011
  name: Command Parser
  related_elements:
  - command_subsystem.mmd
  depends_on:
  - FEAT-008
  - FEAT-001
  acceptance_criteria:
  - id: AC-046
    description: CommandParser converts a raw IRC input line into a command name, ordered middle parameters,
      and an optional trailing parameter.
  - id: AC-047
    description: Parsing preserves spaces inside the trailing parameter, removes only protocol delimiters,
      and handles CRLF framing according to the network input contract.
  - id: AC-048
    description: Parser rejects malformed lines, empty command names, invalid parameter layouts, and messages
      exceeding IRC protocol length/parameter limits.
  - id: AC-049
    description: Malformed or incomplete input raises a typed parsing/business exception that lets the
      caller decide whether to send an IRC error or close the connection.
  tasks:
  - id: T-040
    description: Tests CommandParser
  - id: T-041
    description: Implement CommandParser
  - id: T-042
    description: Refactor CommandParser
- id: FEAT-012
  name: Command management (CommandSystem)
  related_elements:
  - command_subsystem.mmd
  depends_on:
  - FEAT-010
  - FEAT-011
  acceptance_criteria:
  - id: AC-050
    description: CommandSystem obtains complete IRC messages from the input buffer, parses them, resolves
      commands through CommandFactory, and dispatches them in input order.
  - id: AC-051
    description: CommandSystem applies the configured security-filter chain before executing a command
      and does not execute rejected commands.
  - id: AC-052
    description: Multiple complete messages in one input buffer are dispatched independently, while incomplete
      trailing data remains buffered for the next read.
  - id: AC-053
    description: Command execution failures are isolated to the relevant message/client and are converted
      into the appropriate IRC error response without terminating the whole server loop.
  - id: AC-054
    description: Parser, command lookup, authorization, and command execution failures propagate as the
      appropriate typed business exceptions to the protocol error-handling boundary.
  tasks:
  - id: T-043
    description: Tests Command System
    tdd_step: Red
    related_elements:
    - command_subsystem.mmd
  - id: T-044
    description: Implement Command System
    tdd_step: Green
    related_elements:
    - command_subsystem.mmd
  - id: T-045
    description: Refactor Command System
    tdd_step: Refactor
    related_elements:
    - command_subsystem.mmd
- id: FEAT-013
  name: ISocketService
  related_elements:
  - server.mmd
  depends_on: []
  acceptance_criteria:
  - id: AC-055
    description: TickResult carries outbound bytes/messages and the socket descriptors scheduled for closure
      without conflating the two result categories.
  - id: AC-056
    description: ISocketService defines the event-loop tick contract and exposes the inputs/outputs needed
      by the server without prescribing a concrete socket implementation.
  tasks:
  - id: T-046
    description: Tests TickResult
    tdd_step: Red
    related_elements:
    - server.mmd
  - id: T-047
    description: Implement TickResult
    tdd_step: Green
    related_elements:
    - server.mmd
  - id: T-048
    description: Refactor TickResult
    tdd_step: Refactor
    related_elements:
    - server.mmd
  - id: T-049
    description: Tests ISocketService
    tdd_step: Red
    related_elements:
    - server.mmd
  - id: T-050
    description: Implement ISocketService
    tdd_step: Green
    related_elements:
    - server.mmd
  - id: T-051
    description: Refactor ISocketService
    tdd_step: Refactor
    related_elements:
    - server.mmd
- id: FEAT-014
  name: Socket server
  related_elements:
  - server.mmd
  depends_on:
  - FEAT-013
  - FEAT-001
  acceptance_criteria:
  - id: AC-057
    description: SocketServer binds and listens on the configured address and port, and reports startup
      failures without leaving partially initialized sockets.
  - id: AC-058
    description: New connections are accepted non-blockingly and each accepted connection is assigned
      a valid descriptor and initialized client state.
  - id: AC-059
    description: A single poll-based event loop monitors listening, readable, and writable sockets without
      blocking on an individual client.
  - id: AC-060
    description: Readable events append received bytes to the corresponding client input buffer; writable
      events send queued bytes and preserve unsent data after partial writes.
  - id: AC-061
    description: Hangups, peer disconnects, and socket errors close the affected connection and trigger
      client cleanup without stopping the server.
  - id: AC-062
    description: Socket setup, accept, poll, read, and write failures are surfaced as appropriate typed
      business/system exceptions and handled without corrupting other clients.
  tasks:
  - id: T-052
    description: Tests SocketServer
    tdd_step: Red
    related_elements:
    - server.mmd
  - id: T-053
    description: Implement SocketServer
    tdd_step: Green
    related_elements:
    - server.mmd
  - id: T-054
    description: Refactor SocketServer
    tdd_step: Refactor
    related_elements:
    - server.mmd
- id: FEAT-015
  name: IRCService
  related_elements:
  - server.mmd
  depends_on:
  - FEAT-013
  - FEAT-012
  - FEAT-007
  - FEAT-006
  acceptance_criteria:
  - id: AC-063
    description: IRCService implements the ISocketService tick contract and coordinates socket events
      with ClientSystem and CommandSystem.
  - id: AC-064
    description: Each tick processes newly accepted connections, readable client data, pending IRC commands,
      queued output, and requested socket closures in a deterministic order.
  - id: AC-065
    description: IRCService queues protocol replies for the correct client and does not perform blocking
      writes or lose data after partial writes.
  - id: AC-066
    description: Disconnects and command failures are isolated to the affected client while the service
      continues processing other clients.
  - id: AC-067
    description: Invalid tick state, unknown client references, and unrecoverable service-level failures
      raise appropriate typed business exceptions.
  tasks:
  - id: T-055
    description: Tests IRCService
    tdd_step: Red
    related_elements:
    - server.mmd
  - id: T-056
    description: Implement IRCService
    tdd_step: Green
    related_elements:
    - server.mmd
  - id: T-057
    description: Refactor IRCService
    tdd_step: Refactor
    related_elements:
    - server.mmd
- id: FEAT-016
  name: PASS command
  related_elements:
  - client_subsystem.mmd
  depends_on:
  - FEAT-010
  - FEAT-007
  acceptance_criteria:
  - id: AC-068
    description: PASS accepts the server password only with the required parameter and records successful
      authentication for the issuing connection.
  - id: AC-069
    description: PASS rejects missing or incorrect passwords and does not mark the client authenticated
      on failure.
  - id: AC-070
    description: PASS is processed before registration completion and is not accepted as a way to change
      credentials after registration has completed.
  - id: AC-071
    description: The server sends the appropriate numeric error for missing parameters or an invalid password
      and does not expose the configured password in replies or logs.
  - id: AC-072
    description: PASS validation and authentication-state failures raise the appropriate business exceptions
      for translation into IRC numeric replies.
  tasks:
  - id: T-058
    description: Tests PASS command
    tdd_step: Red
    related_elements:
    - client_subsystem.mmd
  - id: T-059
    description: Implement PASS command
    tdd_step: Green
    related_elements:
    - client_subsystem.mmd
  - id: T-060
    description: Refactor PASS command
    tdd_step: Refactor
    related_elements:
    - client_subsystem.mmd
  - id: T-061
    description: Tests PASS command in CommandFactory
    tdd_step: Red
    related_elements:
    - command_subsystem.mmd
  - id: T-062
    description: Implement PASS command in CommandFactory
    tdd_step: Green
    related_elements:
    - command_subsystem.mmd
  - id: T-063
    description: Refactor PASS command in CommandFactory
    tdd_step: Refactor
    related_elements:
    - command_subsystem.mmd
- id: FEAT-017
  name: QUIT command
  related_elements: []
  depends_on:
  - FEAT-010
  - FEAT-007
  - FEAT-006
  acceptance_criteria:
  - id: AC-073
    description: QUIT terminates only the issuing client's connection and accepts an optional trailing
      quit message.
  - id: AC-074
    description: QUIT removes the client from all joined channels, releases its nickname, removes it from
      client registries, and schedules its socket for closure.
  - id: AC-075
    description: QUIT broadcasts one correctly formatted QUIT message to the client's former channel peers
      before membership cleanup makes that information unavailable.
  - id: AC-076
    description: QUIT cleanup is safe when invoked more than once or when the client has already disconnected.
  - id: AC-077
    description: Unknown-client or invalid lifecycle conditions encountered during QUIT raise the appropriate
      business exception and do not corrupt other clients' state.
  tasks:
